name: Build Crownfall Fold5 APK v3.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - crownfall-fold5-v301
    paths:
      - .github/workflows/crownfall-fold5-v301.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and repair Android project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import struct
          import zipfile
          import zlib
          from pathlib import Path

          root = Path('crownfall_v301_payload')
          specs = [
              ('part00.b64', 19000), ('part01_0.b64', 9500), ('part01_1.b64', 9500),
              ('part02_0.b64', 9500), ('part02_1.b64', 9500), ('part03.b64', 19000),
              ('part04.b64', 19000), ('part05.b64', 19000), ('part06.b64', 19000),
              ('part07.b64', 17496),
          ]
          encoded = ''.join((root / name).read_text(encoding='utf-8').strip()[:size]
                            for name, size in specs)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          if len(encoded) != 150496 or digest != '4908bf79340bbfcfce350f2b89f71096a219f222011d2e32fc57ea1cb632c9bb':
              raise SystemExit(f'project payload mismatch: len={len(encoded)} sha={digest}')

          archive = Path('crownfall-v3.0.1-project.zip')
          archive.write_bytes(data)
          raw_archive = archive.read_bytes()
          out_root = Path('build_input')
          recovered = []
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  target = out_root / info.filename
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      payload = zf.read(info)
                  except zipfile.BadZipFile:
                      off = info.header_offset
                      fields = struct.unpack_from('<IHHHHHIIIHH', raw_archive, off)
                      name_len, extra_len = fields[-2], fields[-1]
                      start = off + 30 + name_len + extra_len
                      compressed = raw_archive[start:start + info.compress_size]
                      if info.compress_type == zipfile.ZIP_STORED:
                          payload = compressed
                      elif info.compress_type == zipfile.ZIP_DEFLATED:
                          payload = zlib.decompress(compressed, -15)
                      else:
                          raise RuntimeError(f'unsupported compression: {info.filename}')
                      recovered.append(info.filename)
                  target.write_bytes(payload)

          game = Path('build_input/KingdomRemnantCrownfall/app/src/main/assets/game/game.js')
          text = game.read_text(encoding='utf-8')
          broken = "victory:[612,'45,'triangle',.05]"
          fixed = "victory:[620,.45,'triangle',.05]"
          if broken not in text:
              raise SystemExit('known damaged game.js sequence not found')
          game.write_text(text.replace(broken, fixed, 1), encoding='utf-8')

          required = [
              game,
              Path('build_input/KingdomRemnantCrownfall/app/src/main/assets/game/world3d.js'),
              Path('build_input/KingdomRemnantCrownfall/app/src/main/assets/game/adaptive-v301.js'),
              Path('build_input/KingdomRemnantCrownfall/app/src/main/assets/game/adaptive-v301.css'),
              Path('build_input/KingdomRemnantCrownfall/app/src/main/assets/game/index.html'),
              Path('build_input/KingdomRemnantCrownfall/app/build.gradle'),
              Path('build_input/KingdomRemnantCrownfall/gradlew'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('missing files:\n' + '\n'.join(missing))

          Path('debug_output').mkdir(exist_ok=True)
          Path('debug_output/recovered-game.js').write_bytes(game.read_bytes())
          Path('debug_output/recovery.txt').write_text(
              f'archive_sha256={digest}\nrecovered={recovered}\n'
              f'game_sha256={hashlib.sha256(game.read_bytes()).hexdigest()}\n', encoding='utf-8')
          print(Path('debug_output/recovery.txt').read_text())
          PY

      - name: Upload recovered source for exact comparison
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-recovered-game-source
          path: debug_output/
          if-no-files-found: error
          retention-days: 2

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check build_input/KingdomRemnantCrownfall/app/src/main/assets/game/game.js
          node --check build_input/KingdomRemnantCrownfall/app/src/main/assets/game/world3d.js
          node --check build_input/KingdomRemnantCrownfall/app/src/main/assets/game/adaptive-v301.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build OWNER and STORE debug APKs
        working-directory: build_input/KingdomRemnantCrownfall
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleOwnerDebug :app:assembleStoreDebug

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='build_input/KingdomRemnantCrownfall'
          mkdir -p output
          OWNER_APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name '*owner*debug*.apk' | head -n 1)
          STORE_APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name '*store*debug*.apk' | head -n 1)
          test -n "$OWNER_APK" && test -f "$OWNER_APK"
          test -n "$STORE_APK" && test -f "$STORE_APK"
          cp "$OWNER_APK" output/KingdomRemnant-Crownfall-v3.0.1-Fold5-OWNER.apk
          cp "$STORE_APK" output/KingdomRemnant-Crownfall-v3.0.1-Fold5-STORE.apk

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for APK in output/*.apk; do
            echo "===== $APK =====" | tee -a output/BUILD_REPORT.txt
            unzip -t "$APK" | tail -n 2 | tee -a output/BUILD_REPORT.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a output/BUILD_REPORT.txt
            "$AAPT" dump badging "$APK" | head -n 5 | tee -a output/BUILD_REPORT.txt
            unzip -l "$APK" | grep -E 'classes.dex|assets/game/index.html|assets/game/adaptive-v301.css|assets/game/adaptive-v301.js|assets/game/world3d.js' | tee -a output/BUILD_REPORT.txt
          done
          sha256sum output/*.apk | tee output/SHA256.txt
          ls -lh output

      - name: Upload verified APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-v3.0.1-fold5-apks
          path: output/
          if-no-files-found: error
          retention-days: 7
