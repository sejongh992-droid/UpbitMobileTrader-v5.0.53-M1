name: Build Crownfall Fold5 APK v3.0.1

on:
  workflow_dispatch:
  push:
    branches:
      - crownfall-fold5-v301
    paths:
      - .github/workflows/crownfall-fold5-v301.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import zipfile
          from pathlib import Path

          root = Path('crownfall_v301_payload')
          specs = [
              ('part00.b64', 19000),
              ('part01_0.b64', 9500),
              ('part01_1.b64', 9500),
              ('part02_0.b64', 9500),
              ('part02_1.b64', 9500),
              ('part03.b64', 19000),
              ('part04.b64', 19000),
              ('part05.b64', 19000),
              ('part06.b64', 19000),
              ('part07.b64', 17496),
          ]

          chunks = []
          for name, expected in specs:
              value = (root / name).read_text(encoding='utf-8').strip()
              if len(value) < expected:
                  raise SystemExit(f'{name}: too short ({len(value)} < {expected})')
              value = value[:expected]
              if len(value) != expected:
                  raise SystemExit(f'{name}: invalid length {len(value)}')
              chunks.append(value)

          encoded = ''.join(chunks)
          if len(encoded) != 150496:
              raise SystemExit(f'combined base64 length mismatch: {len(encoded)}')

          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected_digest = '9d907d025e06188875f1080a6092aec9a7e40c055e937613b871475c0c636781'
          if digest != expected_digest:
              raise SystemExit(f'project SHA-256 mismatch: {digest}')

          archive = Path('crownfall-v3.0.1-project.zip')
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'project ZIP corrupt at {bad}')
              zf.extractall('build_input')
          print(f'project verified: {len(data)} bytes / {digest}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build OWNER and STORE debug APKs
        working-directory: build_input/KingdomRemnantCrownfall
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleOwnerDebug :app:assembleStoreDebug

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='build_input/KingdomRemnantCrownfall'
          mkdir -p output

          OWNER_APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name '*owner*debug*.apk' | head -n 1)
          STORE_APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name '*store*debug*.apk' | head -n 1)
          test -n "$OWNER_APK" && test -f "$OWNER_APK"
          test -n "$STORE_APK" && test -f "$STORE_APK"

          cp "$OWNER_APK" output/KingdomRemnant-Crownfall-v3.0.1-Fold5-OWNER.apk
          cp "$STORE_APK" output/KingdomRemnant-Crownfall-v3.0.1-Fold5-STORE.apk

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          for APK in output/*.apk; do
            echo "===== $APK =====" | tee -a output/BUILD_REPORT.txt
            unzip -t "$APK" | tail -n 2 | tee -a output/BUILD_REPORT.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a output/BUILD_REPORT.txt
            "$AAPT" dump badging "$APK" | head -n 5 | tee -a output/BUILD_REPORT.txt
            unzip -l "$APK" | grep -E 'classes.dex|assets/game/index.html|assets/game/adaptive-v301.css|assets/game/adaptive-v301.js|assets/game/world3d.js' | tee -a output/BUILD_REPORT.txt
          done

          sha256sum output/*.apk | tee output/SHA256.txt
          ls -lh output

      - name: Upload verified APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-v3.0.1-fold5-apks
          path: output/
          if-no-files-found: error
          retention-days: 7
